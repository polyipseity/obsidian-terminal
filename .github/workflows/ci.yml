# CI: Build & Test
#
# Purpose:
#   - Run repository checks: setup, install, test, and build.
#   - Ensure a minimal, reproducible environment for quick CI feedback.
#
# Triggers:
#   - push, pull_request, workflow_dispatch
#
# Security & reproducibility notes:
#   - Use least-privilege permissions (contents: read) and pin action versions where appropriate.
#   - Use local caches to speed builds and reduce external load.

name: "CI: Build & Test"

on:
  pull_request:
  push:
    branches:
      - "**" # Listen to pushes on all branches
    tags-ignore:
      - "**" # Ignore tag pushes
  workflow_dispatch:

# Use concurrency to deduplicate runs.
# - For pull requests: group by `pr-<number>` so multiple commits to the same PR
#   cancel previous runs and only the latest is kept.
# - For direct pushes: fall back to deduplicating by commit SHA so identical
#   commits don't trigger multiple concurrent workflows.
# - Include the `github.workflow` name in the group to avoid cross-workflow collisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: "Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: "recursive"

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          resolution-strategy: "lowest"

      - name: Install project
        run: |
          cd vendor/obsidian-plugin-library
          bun install --frozen-lockfile --ignore-scripts
          bun run build:force
          cd ../..
          bun install --frozen-lockfile --ignore-scripts
          uv sync --locked

      - name: Run tests
        run: bun run test

      - name: Build project
        run: bun run build

  windows-native:
    name: "Windows native PTY (${{ matrix.python }})"
    runs-on: windows-2025
    # Cap the job: a wedged pseudoconsole handle must not burn the 6 h default
    # on a runner billed at twice the Linux rate.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python and the newest one users install.
        python: ["3.9", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: "recursive"

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      # Set up uv before `bun install`: its cache key hashes files matching a
      # glob, and walking `node_modules` on Windows took over a minute.
      # `python-version` keeps the matrix legs from racing for one cache key.
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          resolution-strategy: "lowest"
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python }}

      # A cache hit below skips the vendor's own `bun install`, which used to
      # fill Bun's download cache for the root install. Keep that cache instead.
      - name: Locate the Bun download cache
        id: bun-cache
        shell: bash
        run: |
          dir=$(bun pm cache)
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Restore the Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock', 'vendor/obsidian-plugin-library/bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-

      # The vendored library's `dist` depends only on the submodule commit, so
      # reuse it across runs and skip the library's own install and build.
      # (Not in the Linux job: ESLint lints vendor/ with the vendor's own
      # config, which needs the vendor's node_modules.)
      - name: Resolve the vendored library commit
        id: vendor
        shell: bash
        # On its own line, so a failed lookup stops the step (`bash -e`)
        # instead of giving the cache key an empty commit.
        run: |
          sha=$(git rev-parse HEAD:vendor/obsidian-plugin-library)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore the vendored library build
        id: vendor-dist
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: vendor/obsidian-plugin-library/dist
          key: vendor-dist-${{ runner.os }}-${{ steps.vendor.outputs.sha }}

      # Build dist before Bun copies the file: dependency into its store.
      - name: Build the vendored library
        if: steps.vendor-dist.outputs.cache-hit != 'true'
        working-directory: vendor/obsidian-plugin-library
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build:force

      - name: Install TypeScript tests
        run: bun install --frozen-lockfile --ignore-scripts

      # Bun Shell runs `rm -f` for `bun run` on Windows.
      - name: Check that `bun run clean` works on Windows
        run: |
          $files = "main.js", "metafile.json", "styles.css"
          New-Item -ItemType File $files | Out-Null
          bun run clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $left = $files | Where-Object { Test-Path $_ }
          if ($left) { throw "bun run clean left: $left" }
          bun run clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install the locked Windows test environment
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Run ConPTY host and ConHost resizer tests
        run: >-
          uv run --locked --python ${{ matrix.python }} pytest
          -n 0 --no-cov
          tests/src/terminal/test_win32_conpty.py
          tests/src/terminal/test_win32_resizer.py

      - name: Run repository checks without asynchronous test dependencies
        run: >-
          uv run --locked --python ${{ matrix.python }} pytest -n 0 --no-cov
          tests/test_docstrings.py tests/test_module_exports.py
          tests/test_git_executable.py tests/src/test_python_imports_consistency.py

      - name: Run the real TypeScript to Python ConPTY contract
        run: >-
          uv run --locked --python ${{ matrix.python }}
          bun x vitest run tests/src/terminal/pseudoterminal.test.ts
