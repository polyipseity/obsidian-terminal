# Release Workflow: Version Tag Build
#
# On a version tag push, builds and attests main.js, manifest.json and styles.css.
# Creates or updates a draft. Publish it by hand only after the release run for
# that tag has finished, because publishing during the run can let an upload
# replace published files. A release already published when the run reaches the
# release step keeps its files.
# Release titles retain existing text when they already contain the version tag.

name: "Release: Version Tag Build"
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    name: "Draft Versioned Release"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: "recursive"

      - name: Check the tag matches manifest.json
        run: jq -e --arg tag "$GITHUB_REF_NAME" '.version == $tag' manifest.json

      # An attestation cannot be withdrawn, so what can stop the release is
      # checked before the build. A release that is already published ends the
      # run here: every later step is skipped.
      - name: Check the release state and notes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/draft-release.sh check

      - name: Setup bun
        if: steps.check.outputs.published != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Setup uv
        if: steps.check.outputs.published != 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          resolution-strategy: "lowest"

      - name: Install project
        if: steps.check.outputs.published != 'true'
        run: |
          cd vendor/obsidian-plugin-library
          bun install --frozen-lockfile --ignore-scripts
          bun run build:force
          cd ../..
          bun install --frozen-lockfile --ignore-scripts
          uv sync --locked

      - name: Build project
        if: steps.check.outputs.published != 'true'
        run: bun run build

      # The files are attested and released under the tag's name, and the tag
      # can be moved while the build runs.
      - name: Check the tag still points at the built commit
        if: steps.check.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/draft-release.sh tag

      - name: Attest build provenance
        if: steps.check.outputs.published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Reads the release state again: it can have changed during the build.
      - name: Draft release
        if: steps.check.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/draft-release.sh draft
