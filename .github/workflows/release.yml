# Release Workflow: Version Tag Build
#
# On a version tag push, builds and attests main.js, manifest.json and styles.css.
# Creates or updates a draft. Publish it by hand only after the release run for
# that tag has finished, because publishing during the run can let an upload
# replace published files. A release already published when the run reaches the
# release step keeps its files.
# Release titles retain existing text when they already contain the version tag.

name: "Release: Version Tag Build"
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    name: "Draft Versioned Release"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: "recursive"

      - name: Check the tag matches manifest.json
        run: jq -e --arg tag "$GITHUB_REF_NAME" '.version == $tag' manifest.json

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          resolution-strategy: "lowest"

      - name: Install project
        run: |
          cd vendor/obsidian-plugin-library
          bun install --frozen-lockfile --ignore-scripts
          bun run build:force
          cd ../..
          bun install --frozen-lockfile --ignore-scripts
          uv sync --locked

      - name: Build project
        run: bun run build

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          release_error="$RUNNER_TEMP/release-view.stderr"
          if release="$(gh release view "$tag" --json isDraft,name 2> "$release_error")"; then
            cat "$release_error"
            is_draft="$(jq -r '.isDraft' <<< "$release")"
            title="$(jq -r '.name' <<< "$release")"
            if [[ "$title" != *"$tag"* ]]; then
              gh release edit "$tag" --title "$tag"
            fi
            if [[ "$is_draft" == true ]]; then
              gh release upload "$tag" main.js manifest.json styles.css --clobber
            else
              echo "::warning::Published files were left as they are; this run's attestations describe this run's build."
            fi
          # gh release view prints this text when the tag has neither a published release nor a draft.
          elif grep -Fq 'release not found' "$release_error"; then
            echo "No release for $tag yet; creating a draft."
            notes_file="$RUNNER_TEMP/release-notes.md"
            awk -v v="$tag" '/^## /{p=($2==v);next} p' CHANGELOG.md > "$notes_file"
            if [[ ! -s "$notes_file" ]]; then
              echo "::error::No CHANGELOG.md notes found for $tag."
              exit 1
            fi
            gh release create "$tag" main.js manifest.json styles.css \
              --draft --title "$tag" --notes-file "$notes_file"
          else
            cat "$release_error"
            echo "::error::Release state for tag $tag could not be read."
            exit 1
          fi
